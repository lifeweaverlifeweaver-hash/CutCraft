<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutCraft - Интелигентно Проектиране и Разкрой на Мебели</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #canvas-container {
            width: 100%;
            height: 400px;
            background: #1e293b;
            border-radius: 0.75rem;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Навигация -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl"><i class="fa-solid fa-ruler-combined"></i></div>
                <span class="text-2xl font-black tracking-wider text-white">Cut<span class="text-indigo-500">Craft</span></span>
            </div>
            <div class="text-sm font-semibold bg-indigo-950 border border-indigo-800 text-indigo-300 px-3 py-1.5 rounded-full">
                <i class="fa-solid fa-shield-halved mr-1"></i> Професионален Проект & Разкрой
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Конфигуратор (Лява колона) -->
        <section class="lg:col-span-5 bg-slate-800/60 border border-slate-700/60 p-6 rounded-2xl space-y-6">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-400"></i> Параметри на мебелния модул
            </h2>

            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">Избор на тип мебел</label>
                <select id="furniture-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-indigo-500 outline-none" onchange="updateCalculation()">
                    <option value="wardrobe">Гардероб / Страничен Шкаф</option>
                    <option value="kitchen_base">Кухня: Долен шкаф</option>
                    <option value="kitchen_top">Кухня: Горен шкаф</option>
                    <option value="kitchen_tall">Кухня: Колона за фурна/фризер</option>
                    <option value="commode">Скрин / Шкаф с чекмеджета</option>
                    <option value="desk">Офис бюро / Работна маса</option>
                    <option value="bed">Легла & Основи</option>
                </select>
            </div>

            <!-- Размери -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Височина (мм)</label>
                    <input type="number" id="height" value="2000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-center text-white font-bold" oninput="updateCalculation()">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ширина (мм)</label>
                    <input type="number" id="width" value="800" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-center text-white font-
